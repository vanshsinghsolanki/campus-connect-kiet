<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Resources · Campus Connect</title>
  <meta name="description" content="Notes, previous-year papers, roadmaps, e-books and courses curated by seniors and alumni.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.setAttribute("data-theme","light");try{localStorage.setItem("cc:theme",JSON.stringify("light"))}catch(e){}</script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/pages/resources.js" defer></script>
</head>
<body data-page="resources">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" tabindex="-1">
    <header class="container page-head">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> <span aria-hidden="true">/</span> <span aria-current="page">Resources</span></nav>
      <h1>Resource library</h1>
      <p>Notes, previous-year papers, roadmaps, e-books and courses, curated by seniors and alumni.</p>
    </header>

    <div class="container mt-3">
      <form id="res-filters" role="search" aria-label="Search and filter resources">
        <fieldset class="segmented" id="type-options">
          <legend class="sr-only">Resource type</legend>
        </fieldset>

        <div class="listing">
          <div class="filters-sheet" id="filters-sheet">
            <div class="filters-sheet__backdrop" data-sheet-close></div>
            <aside class="filters" aria-labelledby="filters-title">
              <div class="filters__head">
                <h2 id="filters-title">Filters</h2>
                <div class="btn-row">
                  <button type="reset" class="btn btn--ghost btn--sm">Clear all</button>
                  <button type="button" class="icon-btn filters__close" data-sheet-close aria-label="Close filters"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
                </div>
              </div>

              <div class="filters__group">
                <label for="f-department">Department</label>
                <select id="f-department" name="department"><option value="">All departments</option></select>
              </div>

              <div class="filters__group">
                <label for="f-subject">Subject</label>
                <select id="f-subject" name="subject"><option value="">All subjects</option></select>
              </div>

              <fieldset class="filters__group">
                <legend>My list</legend>
                <div class="check-list">
                  <label class="check"><input type="checkbox" name="saved" value="1"><span>Saved only</span></label>
                </div>
              </fieldset>

              <div class="filters__foot">
                <button type="reset" class="btn btn--outline">Clear</button>
                <button type="button" class="btn btn--primary" data-sheet-close>Show <span data-result-count>0</span> results</button>
              </div>
            </aside>
          </div>

          <section aria-labelledby="results-title">
            <h2 id="results-title" class="sr-only">Results</h2>
            <div class="listing__toolbar">
              <div class="input-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <label for="f-q" class="sr-only">Search resources</label>
                <input id="f-q" type="search" name="q" placeholder="Search title, subject…" autocomplete="off">
              </div>
              <label for="f-sort" class="sr-only">Sort by</label>
              <select id="f-sort" name="sort">
                <option value="popular">Sort: Most downloaded</option>
                <option value="title">Title (A–Z)</option>
              </select>
              <button type="button" class="btn btn--outline filter-toggle" id="filter-toggle" aria-controls="filters-sheet" aria-expanded="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
                Filters <span class="count" id="filter-count"></span>
              </button>
            </div>

            <div class="listing__summary">
              <p aria-live="polite" id="result-summary">Loading resources…</p>
              <div class="active-filters" id="active-filters"></div>
            </div>

            <div class="grid grid--2" id="results"></div>
          </section>
        </div>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>
</body>
</html>
